check:
  name: Check satellite
  description: Administrator-only, bounded read-only SSH inspection. No installation, restart or automatic polling.
  fields:
    entry_id:
      name: Configuration entry ID
      description: Copy entry_id from the satellite manager status sensor attributes.
      required: true
      selector:
        text:

deploy_node:
  name: Deploy and start Node Exporter
  description: Verify and install the pinned native payload if missing, restrict its firewall endpoint, and start it.
  fields:
    entry_id:
      name: Satellite entry ID
      required: true
      selector:
        text:

start_node:
  name: Start Node Exporter
  description: Start an already installed, verified Node Exporter. Does not download or upgrade.
  fields:
    entry_id:
      name: Satellite entry ID
      required: true
      selector:
        text:

stop_node:
  name: Stop Node Exporter
  description: Stop only this manager's process and remove only its exact firewall rules. Automatic recovery is disabled before attempting Stop, even while unreachable.
  fields:
    entry_id:
      name: Satellite entry ID
      required: true
      selector:
        text:

uninstall_node:
  name: Uninstall Node Exporter
  description: Stop and remove only this manager's installation. Automatic recovery is disabled first. Existing unmanaged installations are refused.
  fields:
    entry_id:
      name: Satellite entry ID
      required: true
      selector:
        text:

set_node_recovery:
  name: Set automatic Node Exporter recovery
  description: Enable recovery immediately and on monitoring ticks, or disable future recovery without stopping a running process. Start/Deploy enable recovery; Stop/Uninstall disable it.
  fields:
    entry_id:
      name: Satellite entry ID
      required: true
      selector:
        text:
    enabled:
      name: Enable automatic recovery
      required: true
      selector:
        boolean:

deploy_stream:
  name: Deploy log streamer
  description: Explicitly deploy the managed log streamer.
  fields:
    entry_id:
      required: true
      selector:
        text:

start_stream:
  name: Start log streamer
  description: Explicitly start the managed log streamer.
  fields:
    entry_id:
      required: true
      selector:
        text:

stop_stream:
  name: Stop log streamer
  description: Explicitly stop the managed log streamer.
  fields:
    entry_id:
      required: true
      selector:
        text:

uninstall_stream:
  name: Uninstall log streamer
  description: Explicitly uninstall the managed log streamer.
  fields:
    entry_id:
      required: true
      selector:
        text:

set_stream_recovery:
  name: Set automatic log streamer recovery
  fields:
    entry_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

set_cpu_all_cores:
  name: Keep all CPU cores online
  description: Request all cores through supported MediaTek HPS controls, preserving thermal limits. Disabling restores the prior minimum.
  fields:
    entry_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
